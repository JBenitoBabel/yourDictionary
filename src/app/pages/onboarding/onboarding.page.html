<ion-content [fullscreen]="true" class="onboarding-content">
  <div class="welcome-container">
    <h1 class="welcome-title">Welcome to YourDictionary</h1>
    <p class="welcome-subtitle">Selecciona tu idioma / Select your language</p>

    <div class="language-grid">
      @for (lang of languages; track lang.code) {
        <ion-card class="language-card" (click)="selectLanguage(lang.code)">
          <ion-card-content class="language-card-content">
            <span class="language-flag">{{ lang.flag }}</span>
            <ion-card-title class="language-name">{{ lang.name }}</ion-card-title>
          </ion-card-content>
        </ion-card>
      }
    </div>
  </div>
</ion-content>
