<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{ title() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Points Banner -->
  <div class="points-banner">
    <div class="points-info">
      <div class="points-row">
        <div class="points-item">
          <span class="points-label">Puntos</span>
          <div class="points-value">
            <span class="number">{{ points() }}</span>
          </div>
        </div>
        <div class="points-item">
          <span class="points-label">Palabras</span>
          <div class="points-value">
            <span class="number">{{ wordsCount() }}</span>
          </div>
        </div>
        <div class="points-item">
          <span class="points-label">Cartas</span>
          <div class="points-value">
            <span class="number">{{ cardsCount() }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="home-content">
    @if (hasWords()) {
      <div class="section">
        <app-word-card
          [word]="wordOfTheDay()"
          [isFlipped]="isFlipped()"
          (flip)="flipCard()">
        </app-word-card>
      </div>
    } @else {
      <div class="empty-state-large">
        <ion-icon name="book-outline"></ion-icon>
        <h3>Comienza tu vocabulario</h3>
        <p>Añade tu primera palabra con el botón +</p>
      </div>
    }

    @if (hasEnoughWordsForQuiz()) {
      <div class="section">
        <app-quiz-card 
          [quiz]="currentQuiz()"
          [quizAnswered]="quizAnswered()"
          (startQuiz)="startQuiz()"
          (selectAnswer)="selectAnswer($event)"
          (close)="onQuizClose()">
        </app-quiz-card>
      </div>
    }
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-buttons">
      <ion-button fill="solid" class="nav-btn" (click)="goToDictionary()">
        <ion-icon slot="start" name="library-outline"></ion-icon>
        Mi Diccionario
      </ion-button>
      <ion-button fill="solid" class="nav-btn mazo-btn" (click)="goToMazo()">
        <ion-icon slot="start" name="card-outline"></ion-icon>
        Mi Mazo
      </ion-button>
    </div>
  </div>

  <!-- FAB -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="goToAddWord()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
