<div class="flip-card" (click)="onCardClick()">
  <div class="flip-card-inner" [class.flipped]="isFlipped">
    <div class="flip-card-front">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Palabra del Día</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          @if (word) {
            <p class="word">{{ word.original }}</p>
            <p class="hint">Toca para ver la traducción</p>
          } @else {
            <p class="no-word">No hay palabras disponibles</p>
          }
        </ion-card-content>
      </ion-card>
    </div>
    <div class="flip-card-back">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Traducción</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          @if (word) {
            <p class="translation">{{ word.translation }}</p>
            <p class="category">{{ word.category }}</p>
          }
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</div>
